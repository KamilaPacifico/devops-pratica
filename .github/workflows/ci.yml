name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Rodar testes unitários
        run: npm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Rodar testes de integração
        run: npm run test:integration

  build:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Gerar o build
        run: npm run build
      - name: Guardar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist